version: '1.0'
name: opends-gitee-release
displayName: OpenDS 发行版同步
variables:
  OPENDS_RELEASE_TAG: ''
  OPENDS_RELEASE_VERSION: ''
triggers:
  push:
    tags:
      prefix: [v]
strategy:
  blocking: true
  stepTimeout: 3
stages:
  - name: download_release
    displayName: 获取 GitHub 已发布附件
    strategy: naturally
    trigger: auto
    steps:
      - step: build@python
        name: download_assets
        displayName: 下载附件并校验 SHA-256（仅 Shell）
        pythonVersion: '3.9'
        commands:
          - |
            set +x
            set -eu
            for checkout in "${WORKSPACE:-}" "." "/root/workspace/${GITEE_REPO:-${AGILE_MODULE_NAME:-}}"; do
              if [ -n "$checkout" ] && [ -f "$checkout/scripts/Run-GiteeRelease.sh" ]; then
                cd "$checkout"
                exec bash scripts/Run-GiteeRelease.sh
              fi
            done
            echo 'OpenDS source checkout is missing.' >&2
            exit 1
        artifacts:
          - name: OPENDS_RELEASE
            path:
              - ./release-assets
        strategy:
          retry: '0'
  - name: publish_release
    displayName: 发布 Gitee Release
    strategy: naturally
    trigger: auto
    steps:
      - step: release@gitee
        name: release_gitee
        displayName: Gitee Release
        releaseName: OpenDS ${OPENDS_RELEASE_TAG}
        description: https://github.com/Jac0b-Shi/OpenDS/releases/tag/${OPENDS_RELEASE_TAG}
        tagName: ${OPENDS_RELEASE_TAG}
        upstreamArtifact:
          - OPENDS_RELEASE
        assertFiles:
          - ./release-assets/OpenDS-${OPENDS_RELEASE_VERSION}-windows-x64.zip
          - ./release-assets/OpenDS-${OPENDS_RELEASE_VERSION}-source.zip
          - ./release-assets/TAG-SIGNATURE.json
          - ./release-assets/SHA256SUMS.txt
        prerelease: false
        allowUpdate: false
        strategy:
          retry: '0'
