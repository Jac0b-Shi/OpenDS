name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check formatting
        run: cargo fmt --check
      - name: Fetch locked dependencies, including optional source notices
        run: cargo fetch --locked
      - name: Run Rust regression tests
        run: cargo test --locked
      - name: Build release and exercise GUI startup
        shell: pwsh
        run: ./scripts/Build-Release.ps1 -SkipTests
      - name: Keep binary and matching source archives together
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OpenDS-windows-x64
          path: target/dist/*.zip
          if-no-files-found: error
          retention-days: 7
  viiper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: vendor/viiper-source/go.mod
          cache-dependency-path: vendor/viiper-source/go.sum
      - name: Check USB profile, protocol and concurrency
        working-directory: vendor/viiper-source
        run: go test -race ./device/dualsense ./internal/server/usb ./usb ./usbip
