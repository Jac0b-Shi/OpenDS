name: Release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    build:
        uses: ./.github/workflows/build_base.yml
        secrets: inherit
        with:
            artifact_suffix: "-Release"
            upload_artifacts: true

    generate-changelog:
        name: Generate Changelog
        needs: build
        uses: ./.github/workflows/generate-changelog.yml
        with:
            mode: release
            tag_name: ${{ github.ref_name }}

    client-libraries:
        name: Client library smoke builds and pack
        uses: ./.github/workflows/clients_ci.yml
        with:
            artifact_suffix: "-Release"
            upload_artifacts: true
            version: ${{ github.ref_name }}

    create-release:
        name: Create Release
        needs: [build, generate-changelog, client-libraries]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Download all artifacts
              uses: actions/download-artifact@v8
              with:
                  path: artifacts

            - name: Organize and rename artifacts
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p release_files
                  for dir in artifacts/*; do
                    if [ -d "$dir" ]; then
                      for file in "$dir"/*; do
                        if [ -f "$file" ]; then
                          filename="$(basename "$file")"
                          # Strip build suffix so release and snapshot assets share names
                          filename="${filename/-Release./.}"
                          cp "$file" "release_files/$filename"
                        fi
                      done
                    fi
                  done
                  ls -la release_files/

            - name: Extract build info
              id: build_info
              shell: bash
              run: |
                  echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
                  echo "time=$(date +'%H%M')" >> $GITHUB_OUTPUT
                  echo "sha=$(echo ${GITHUB_SHA} | cut -c1-7)" >> $GITHUB_OUTPUT
                  TAG_NAME=${GITHUB_REF#refs/tags/}
                  echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
                  GIT_VERSION=$(git describe --tags --match "v[0-9]*.[0-9]*.[0-9]*" --always || echo "")
                  if [[ ! $GIT_VERSION =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
                    COMMIT_COUNT=$(git rev-list --count HEAD)
                    GIT_VERSION="v0.0.0-${COMMIT_COUNT}-${GITHUB_SHA:0:7}"
                  fi
                  echo "version=$GIT_VERSION" >> $GITHUB_OUTPUT
                  echo "Version from git: $GIT_VERSION"

            - name: Create Release
              id: create_release
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ steps.build_info.outputs.tag_name }}
                  name: "VIIPER ${{ steps.build_info.outputs.version }}"
                  body: |
                      ${{ needs.generate-changelog.outputs.changelog }}

                      ---

                      ## Install / Update

                      <details>
                      <summary><b>Windows (PowerShell)</b></summary>

                      ```powershell
                      irm https://dualsenseclient.github.io/VIIPER/stable/install.ps1 | iex
                      ```
                      Installs / updates to `%LOCALAPPDATA%\VIIPER\viiper.exe`
                      </details>

                      <details>
                      <summary><b>Linux</b></summary>

                      ```bash
                      curl -fsSL https://dualsenseclient.github.io/VIIPER/stable/install.sh | sh
                      ```
                      Installs / updates to `/usr/local/bin/viiper`
                      </details>
                  files: release_files/*
                  prerelease: false
                  draft: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
