name: Deploy Documentation

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viiper-gh-pages
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inject version into install scripts
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            echo "Injecting version: $TAG_NAME into install scripts"
            sed -i "s/VIIPER_VERSION=\"dev-snapshot\"/VIIPER_VERSION=\"$TAG_NAME\"/" scripts/install.sh
            sed -i "s/\\\$viiperVersion = \"dev-snapshot\"/\\\$viiperVersion = \"$TAG_NAME\"/" scripts/install.ps1
          fi

      - name: Copy installation scripts to docs
        run: |
          cp scripts/install.sh docs/install.sh
          cp scripts/install.ps1 docs/install.ps1

      - name: Generate changelog
        run: |
          chmod +x .github/scripts/generate-changelog.sh
          mkdir -p docs/changelog
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            echo "Generating changelog for tagged version: $TAG_NAME"
            .github/scripts/generate-changelog.sh docs/changelog/index.md "$TAG_NAME"
          else
            echo "Generating changelog for main (unreleased)"
            .github/scripts/generate-changelog.sh docs/changelog/index.md
          fi
          if ! head -n1 docs/changelog/index.md | grep -q "^#"; then
            { echo "# Changelog"; echo; cat docs/changelog/index.md; } > docs/changelog/index.md.tmp && mv docs/changelog/index.md.tmp docs/changelog/index.md
          fi
          head -n 20 docs/changelog/index.md

      - name: Build documentation
        run: zensical build --strict

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: false
